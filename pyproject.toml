[project]
name = "parcelpilot-agent"
version = "0.1.0"
description = "ParcelPilot AI support agent (assessment)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042", "B008"]  # B008: FastAPI Depends() default is idiomatic
